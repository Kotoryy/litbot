# ------------------------------------------------------------
# Настройки парсера литературных статей
# ------------------------------------------------------------

# Брать статьи не старше N дней
max_age_days: 3

# Сколько постов максимум отправлять/выводить за один запуск
max_posts_per_run: 10

# Пауза между HTTP-запросами (сек) — чтобы не нагружать сайты
request_delay: 1.0

# Файл базы с уже обработанными ссылками
db_path: seen.sqlite3

telegram:
  # Токен бота берётся из переменной окружения TELEGRAM_BOT_TOKEN
  # Куда слать: @username канала или числовой id чата.
  # Совет: сначала шлите в личку/чат модерации, а не сразу в канал.
  chat_id: "@ltrtr_club"
  # Прикреплять картинку статьи (og:image), если есть
  with_photo: true
  # Хэштег темы (#литература, #классика…) ставится сам — см. topics ниже.
  # Здесь — хэштеги, которые нужны в конце каждого поста (можно оставить пустым)
  hashtags: ""
  # Сколько рубрик максимум ставить одному посту (кроме хэштега темы)
  max_rubrics: 2
  # Пауза между сообщениями (сек)
  send_delay: 3
  # Что писать под заголовком:
  #   lead  — первые абзацы самой статьи (бот открывает страницу)
  #   anons — анонс, который отдаёт сайт (как было раньше)
  summary: lead
  # Примерная длина текста под заголовком (символов)
  summary_chars: 600

# Абзацы, которые не брать в текст поста (начала слов или 're:регулярка')
lead_skip:
  - 're:^все мы начиная с 24 февраля'   # плашка «Горького» на каждой странице
  - 're:родил(ся|ась) в \d{4}'          # биография автора перед текстом
  - 're:(?<![а-яё])(м|спб)\.\s?:'   # выходные данные книги («М.: Издательство…»)
  - 're:^\(.*\)$'                       # целый абзац в скобках

# Рубрики-хэштеги. Пост получает рубрику, если совпало хоть что-то:
#   url     — регулярка по ссылке на статью
#   words   — слова в заголовке (начала слов или 're:регулярка')
#   sources — названия источников из списка sources
# Порядок важен: берутся первые max_rubrics совпавших рубрик.
rubrics:
  - tag: "#рецензия"
    url: '/reviews/'
    words: [рецензи, 're:\bо (книге|романе|сборнике|повести)\b']
  - tag: "#новинки"
    words: ["книги недели", "книги месяца", новинк]
  - tag: "#фрагмент"
    url: '/fragments/'
    words: [фрагмент, отрывок]
  - tag: "#интервью"
    url: '/(intervyu|interview)/'
    words: [интервью, беседа]
  - tag: "#поэзия"
    words: [стих, поэз, поэт]
  - tag: "#премии"
    words: ['re:\bпреми(я|и|ю|ей|ях|ям|ями)\b', лауреат, шорт-лист, лонг-лист, букер, нобелевск, нацбест, «золотая маска»]
  - tag: "#опера"
    words: ['re:\bопер(а|ы|у|е|ой|ах|ами|ный|ная|ное|ного|ной|ном|ные|ных|ную|ным)\b', оперетт]
  - tag: "#балет"
    words: [балет]
  - tag: "#театр"
    words: [театр, спектакл, режиссер, режиссёр]
  - tag: "#кино"
    words: [кино, фильм, сериал, экраниз]
  - tag: "#искусство"
    words: [художник, живопис, выставк, музе, скульптур, галере]
  - tag: "#события"
    words: [ярмарк, фестивал, выставк, презентаци, форум, встреч, встрет, событи]
  - tag: "#эссе"
    url: 'gorky\.media/context/|prochtenie\.org/experiments/'
  - tag: "#даты"
    words: [юбиле, 're:\b\d{2,3} лет\b']
  - tag: "#новости"
    url: 'lgz\.ru/news/'
    sources: ["Коммерсантъ — Культура", "Лента — Культура"]

# Еженедельный дайджест: лучшие посты недели одним сообщением.
# «Лучшие» — по реакциям подписчиков; без реакций — самые свежие.
digest:
  enabled: true
  weekday: 7          # 1 — понедельник … 7 — воскресенье
  time: "19:00"       # не раньше этого времени (часовой пояс — bot.timezone)
  size: 5             # сколько статей в дайджесте
  per_source: 2       # не больше стольких статей с одного сайта
  title: "📚 Главное за неделю"
  hashtags: "#дайджест"

# Настройки бота автопостинга (bot.py)
bot:
  # Telegram id тех, кто может управлять ботом.
  # Узнать свой id: запустите бота и напишите ему /start.
  admins: [178717352]
  # Как часто проверять сайты (мин)
  check_every_min: 60
  # Интервал между постами в канале (мин)
  post_every_min: 180   # раз в 3 часа — около 5 постов в день
  # В эти часы бот ничего не публикует (локальное время). "" — без тихих часов
  quiet_hours: "23:00-08:00"
  # Часовой пояс для тихих часов и времени в /status (на GitHub серверы живут по UTC)
  timezone: "Europe/Moscow"
  # true — новые статьи сначала приходят админам с кнопками «В очередь / Сейчас / Пропустить»
  moderation: false
  # Максимум статей в очереди на каждую тему: лишние (самые старые) отбрасываются
  max_queue: 15
  # Сколько дней статья может ждать в очереди, потом считается устаревшей
  max_age_in_queue_days: 7

# Темы канала. У каждой — хэштег и ключевые слова (начала слов, регистр не важен,
# или 're:регулярка'). Ключевые слова нужны для источников с filter: true:
# статья получает ту тему, чьих слов в заголовке и анонсе нашлось больше.
# При равенстве побеждает тема, которая выше в списке.
topics:
  jazz:
    tag: "#джаз"
    keywords:
      - джаз
      - jazz
      - свинг
      - саксофон
      - биг-бэнд
      - биг-бенд
      - бутман
      - колтрейн
      - армстронг
      - эллингтон

  classical:
    tag: "#классика"
    keywords:
      - филармони
      - симфони
      - оркестр
      - дирижер
      - дирижёр
      - композитор
      - консерватори
      - пианист
      - скрипач
      - виолончел
      - органн
      - 're:\bопер(а|ы|у|е|ой|ах|ами|ный|ная|ное|ного|ной|ном|ные|ных|ную|ным)\b'
      - балет
      - 're:(классическ|академическ)\w* музык'
      - 're:больш\w+ театр'
      - мариинск
      - чайковск
      - рахманинов
      - шостакович
      - прокофьев
      - мусоргск
      - корсаков
      - глинк
      - стравинск
      - скрябин
      - свиридов
      - гергиев
      - башмет
      - мацуев
      - спиваков
      - курентзис
      - юровск

  literature:
    tag: "#литература"
    keywords:
      - литератур
      - книг
      - книжн
      - роман
      - повест
      - 're:рассказ(ы|а|ов|ах|ом|ами|е)?\b'   # не ловит «рассказывает»
      - писател
      - писательниц
      - поэт
      - поэз
      - стихотвор
      - проза
      - прозаик
      - издательств
      - переводчик
      - литпреми
      - букер
      - нобелевск
      - "нацбест"
      - "большая книга"
      - "ясная поляна"
      - библиотек
      - читател
      - non/fiction
      - бестселлер
      - Пушкин
      - Толстой
      - Достоевск
      - Чехов
      - Гоголь
      - Набоков
      - Булгаков

  culture:
    tag: "#культура"
    # общая тема: достаётся статье, только если не подошли джаз, классика или литература
    generic: true
    # не брать в «культуру» поп- и рок-музыку и светскую хронику
    exclude:
      - 're:\bпоп\b'
      - поп-
      - рок-
      - 're:\bрок\b'
      - рэп
      - хип-хоп
      - певиц
      - певец
      - певца
      - клип
      - альбом
      - чарт
      - billboard
      - клавишник
      - гитарист
      - барабанщик
      - вокалист
      - мадонн
      - "тейлор свифт"
    keywords:
      - культур
      - музе
      - выставк
      - театр
      - спектакл
      - режиссер
      - режиссёр
      - фильм
      - кино
      - сериал
      - художник
      - живопис
      - скульптур
      - архитектур
      - фестивал
      - премьер
      - галере
      - искусств

# Если встречается любое из этих слов — статья отбрасывается
exclude:
  - гороскоп
  - реклама
  - "книга жалоб"
  - "книжка-раскладушка"
  - промокод
  # светская хроника из общих культурных лент
  - блогер
  - рэпер
  - тикток
  - реалити
  - развод
  - беременн
  - похудел
  - "стал отцом"
  - "стала матерью"

# Сколько совпадений ключевых слов нужно источникам с filter: true
min_score: 1

# Источники. Варианты:
#   topic: X            — профильный сайт: берём всё, тема X
#   filter: true        — берём только статьи, где нашлись ключевые слова темы
#     topics: [a, b]    — …только этих тем
#     fallback_topic: X — …а не совпавшие тоже берём, с темой X
#     min_score: N      — сколько совпадений нужно (по умолчанию min_score выше)
#   max_age_days: N     — для редко пишущих сайтов: брать статьи до N дней
sources:
  # --- Литература ---
  - name: Год литературы
    type: rss
    url: https://godliteratury.ru/rss
    topic: literature

  - name: Горький
    type: html
    url: https://gorky.media/
    # регулярка для ссылок на статьи на странице
    link_pattern: '^https://gorky\.media/(reviews|context|fragments|intervyu)/[^/]+/?$'
    topic: literature

  - name: Прочтение
    type: html
    url: https://prochtenie.org/
    link_pattern: '^https://prochtenie\.org/(reviews|experiments|texts|interview)/\d+'
    topic: literature

  - name: Textura
    type: rss
    url: https://textura.club/feed/
    topic: literature
    max_age_days: 7

  - name: Формаслов
    type: rss
    url: https://formasloff.ru/feed
    topic: literature
    max_age_days: 7

  - name: Литературная газета
    type: rss
    url: https://lgz.ru/rss/
    filter: true
    min_score: 2   # много нелитературных новостей

  # --- Классическая музыка ---
  - name: ClassicalMusicNews
    type: rss
    url: https://www.classicalmusicnews.ru/feed/
    topic: classical

  - name: Belcanto.ru
    type: rss
    url: https://www.belcanto.ru/rss/
    topic: classical

  - name: Музыкальная жизнь
    type: rss
    url: https://muzlifemagazine.ru/feed/
    filter: true          # бывают новости поп-музыки
    topics: [classical, jazz]
    max_age_days: 5

  - name: Музыкальные сезоны
    type: rss
    url: https://musicseasons.org/feed/
    topic: classical
    max_age_days: 7

  # --- Джаз ---
  - name: Джаз.Ру
    type: rss
    url: https://www.jazz.ru/feed/
    topic: jazz
    max_age_days: 7

  - name: JazzPeople
    type: rss
    url: https://jazzpeople.ru/feed/
    topic: jazz
    max_age_days: 7

  # --- Культура (музыка и литература отсюда получают свои темы) ---
  - name: Газета «Культура»
    type: rss
    url: https://portal-kultura.ru/rss/
    filter: true
    fallback_topic: culture

  - name: The Art Newspaper Russia
    type: rss
    url: https://www.theartnewspaper.ru/rss/
    topic: culture

  - name: Коммерсантъ — Культура
    type: rss
    url: https://www.kommersant.ru/RSS/section-culture.xml
    filter: true
    fallback_topic: culture

  - name: МК — Культура
    type: rss
    url: https://www.mk.ru/rss/culture/index.xml
    filter: true
    fallback_topic: culture

  - name: Лента — Культура
    type: rss
    url: https://lenta.ru/rss/articles/culture
    filter: true
    fallback_topic: culture

  - name: Кольта
    type: rss
    url: https://www.colta.ru/rss
    filter: true
    min_score: 2   # много текстов об обществе и политике
    max_age_days: 7

  - name: Нож
    type: rss
    url: https://knife.media/feed/
    filter: true
    min_score: 2
