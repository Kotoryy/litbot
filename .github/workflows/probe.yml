name: Проверка лент (временная)
on:
  push:
    branches: [topics-test]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python probe/dryrun.py | tee probe/result.txt
      - run: |
          git config user.name "litbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/result.txt
          git commit -m "Результат проверки лент [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
